# 根 runtime：使用官方 dsh-subagent-dsh-sdk provider，按需启动一个目标子 runtime。

# JSON-RPC 服务端：本地调用脚本通过 stdio 向根 Agent 提交一条任务。
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# 根 Agent 与子 Agent 使用同一个本地 vLLM 模型路由。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      vllm:
        apiKeyEnv: VLLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.VLLM_BASE_URL
        models:
          - id: Qwen/Qwen3.6-27B-FP8
            input: [text, image]

# 根 Agent 也使用官方 PTC/Code Mode，通过生成的 SDK 选择并调用一个子 Agent。
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

# 官方本地图片附件存储，供 read_image 将工作区图片转换为图像内容块。
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# 官方子 Agent 服务定义：容纳一个或多个具名 provider。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

# 官方 SDK 子 Agent provider：每次委托启动一个完整的 JSON-RPC DSH 子进程。
- id: subagent-dsh-sdk
  name: '@deepseek-ai/dsh-subagent-dsh-sdk'
  config:
    # 与下方三个 dsh-tool-subagent 的 provider 字段对应。
    providerName: xingyun-list
    # 调用脚本传入 Node 可执行文件、JSON-RPC bin 和 JS 子配置的真实路径。
    command: !!js process.env.XINGYUN_LIST_AGENT_COMMAND
    args: !!js JSON.parse(process.env.XINGYUN_LIST_AGENT_ARGS ?? '[]')
    # initialize 握手中指定子 runtime 使用的模型路由。
    provider: vllm
    model: Qwen/Qwen3.6-27B-FP8
    # 列表 runtime 还需要 JS 子 runtime 的启动信息，供它按需再次委托。
    env: !!js 'Object.fromEntries(Object.entries({ VLLM_API_KEY: process.env.VLLM_API_KEY, VLLM_BASE_URL: process.env.VLLM_BASE_URL, WEKNORA_BASE_URL: process.env.WEKNORA_BASE_URL, WEKNORA_API_KEY: process.env.WEKNORA_API_KEY, WEKNORA_TENANT_ID: process.env.WEKNORA_TENANT_ID, XINGYUN_LIST_KB_ID: process.env.XINGYUN_LIST_KB_ID, XINGYUN_JS_KB_ID: process.env.XINGYUN_JS_KB_ID, XINGYUN_JS_AGENT_COMMAND: process.env.XINGYUN_JS_AGENT_COMMAND, XINGYUN_JS_AGENT_ARGS: process.env.XINGYUN_JS_AGENT_ARGS }).filter(([, value]) => value !== undefined))'

- id: subagent-dsh-sdk-form
  name: '@deepseek-ai/dsh-subagent-dsh-sdk'
  config:
    providerName: xingyun-form
    command: !!js process.env.XINGYUN_FORM_AGENT_COMMAND
    args: !!js JSON.parse(process.env.XINGYUN_FORM_AGENT_ARGS ?? '[]')
    provider: vllm
    model: Qwen/Qwen3.6-27B-FP8
    # 表单 runtime 还需要 JS 子 runtime 的启动信息，供它按需再次委托。
    env: !!js 'Object.fromEntries(Object.entries({ VLLM_API_KEY: process.env.VLLM_API_KEY, VLLM_BASE_URL: process.env.VLLM_BASE_URL, WEKNORA_BASE_URL: process.env.WEKNORA_BASE_URL, WEKNORA_API_KEY: process.env.WEKNORA_API_KEY, WEKNORA_TENANT_ID: process.env.WEKNORA_TENANT_ID, XINGYUN_FORM_KB_ID: process.env.XINGYUN_FORM_KB_ID, XINGYUN_JS_KB_ID: process.env.XINGYUN_JS_KB_ID, XINGYUN_JS_AGENT_COMMAND: process.env.XINGYUN_JS_AGENT_COMMAND, XINGYUN_JS_AGENT_ARGS: process.env.XINGYUN_JS_AGENT_ARGS }).filter(([, value]) => value !== undefined))'

- id: subagent-dsh-sdk-js
  name: '@deepseek-ai/dsh-subagent-dsh-sdk'
  config:
    providerName: xingyun-js
    command: !!js process.env.XINGYUN_JS_AGENT_COMMAND
    args: !!js JSON.parse(process.env.XINGYUN_JS_AGENT_ARGS ?? '[]')
    provider: vllm
    model: Qwen/Qwen3.6-27B-FP8
    env: !!js 'Object.fromEntries(Object.entries({ VLLM_API_KEY: process.env.VLLM_API_KEY, VLLM_BASE_URL: process.env.VLLM_BASE_URL, WEKNORA_BASE_URL: process.env.WEKNORA_BASE_URL, WEKNORA_API_KEY: process.env.WEKNORA_API_KEY, WEKNORA_TENANT_ID: process.env.WEKNORA_TENANT_ID, XINGYUN_JS_KB_ID: process.env.XINGYUN_JS_KB_ID }).filter(([, value]) => value !== undefined))'

# 模型可调用的前台委托工具：使用官方 dsh-tool-subagent 包装上方三个 provider。
- id: xingyun-list-agent-tool
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: xingyun-list
    toolName: xingyun_list_agent
    enableRunInBackground: false
    maxDepth: provider-managed

- id: xingyun-form-agent-tool
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: xingyun-form
    toolName: xingyun_form_agent
    enableRunInBackground: false
    maxDepth: provider-managed

- id: xingyun-js-agent-tool
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: xingyun-js
    toolName: xingyun_js_agent
    # MVP 需要一次调用后直接取得最终结果，不创建后台任务。
    enableRunInBackground: false
    # 进程外 SDK provider 自行管理委托深度，必须使用官方规定的 provider-managed。
    maxDepth: provider-managed

# 根 Agent 主干：只负责选择一个目标子 Agent，并发出完整、独立的任务提示词。
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |-
      你是星云任务协调 Agent。
      mode=list 时调用 xingyun_list_agent；mode=form 时调用 xingyun_form_agent；mode=js 时调用 xingyun_js_agent。
      mode=auto 时根据用户说明、图片和是否存在 sourcePath 判断列表、表单或 JS 增强；无法可靠判断时返回 needs_input。
      每次请求只调用一个目标 Agent。
      必须在独立提示词中传入完整的请求 JSON。
      在 PTC 中，xingyun_list_agent、xingyun_form_agent 或 xingyun_js_agent 的前台结果是 {"kind":"foreground","runId":"...","output":[...] }。只能读取 output 中 type 为 text 的块并拼接为目标 Agent 响应；不得返回 kind、runId、output 或 reasoning 块。
      最终只能返回一个业务 JSON 对象，不能使用 Markdown 围栏：completed 时返回目标 Agent 的 type/status/file；needs_input 或 processing 时原样返回目标 Agent 的业务 JSON。
      目标 Agent 的文本可能含有说明文字或 Markdown 围栏。必须提取其中最后一个完整的业务 JSON 对象；不能因为说明文字而返回自然语言。
      列表 Agent 使用 xingyun_list_agent，表单 Agent 使用 xingyun_form_agent，JS Agent 使用 xingyun_js_agent。
      如果请求 JSON 包含 imagePath，先使用 read_image 读取图片，再根据图片和文字进行路由；不要把图片路径当作图片内容。
    # 根 Agent 不使用工作区、技能目录、shell 或后台任务；MVP 只验证委托链路。
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    # 根路由同样使用 PTC/Code Mode；目标 Agent 工具通过生成的 SDK 调用。
    tools:
      mode: code

# 根 runtime 的独立会话日志；不与 JS 子 runtime 共用目录。
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.xingyun-root-sessions'
    compression: none
