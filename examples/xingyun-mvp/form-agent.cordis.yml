# 表单子 runtime：每次处理一个星云表单 JSON 任务。
# stdout 专用于 JSON-RPC 协议，不能增加会输出到 stdout 的日志插件。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      vllm:
        apiKeyEnv: VLLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.VLLM_BASE_URL
        models:
          - id: Qwen/Qwen3.6-27B-FP8
            input: [text, image]

# 官方 PTC/Code Mode 运行时：模型通过 run_code 中生成的 TypeScript SDK 调用工具。
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

# 官方本地图片附件存储，供 read_image 将工作区图片转换为图像内容块。
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# 官方子 Agent 服务定义：表单 Agent 通过它按需启动独立的 JS runtime。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

# 官方 SDK 子 Agent provider：每次 JS 增强请求启动一个新的 JS runtime。
- id: subagent-dsh-sdk-js
  name: '@deepseek-ai/dsh-subagent-dsh-sdk'
  config:
    providerName: xingyun-js
    command: !!js process.env.XINGYUN_JS_AGENT_COMMAND
    args: !!js JSON.parse(process.env.XINGYUN_JS_AGENT_ARGS ?? '[]')
    provider: vllm
    model: Qwen/Qwen3.6-27B-FP8
    # 只把 JS 子 runtime 必需的模型、WeKnora 和 JS 知识库配置传过进程边界。
    env: !!js 'Object.fromEntries(Object.entries({ VLLM_API_KEY: process.env.VLLM_API_KEY, VLLM_BASE_URL: process.env.VLLM_BASE_URL, WEKNORA_BASE_URL: process.env.WEKNORA_BASE_URL, WEKNORA_API_KEY: process.env.WEKNORA_API_KEY, WEKNORA_TENANT_ID: process.env.WEKNORA_TENANT_ID, XINGYUN_JS_KB_ID: process.env.XINGYUN_JS_KB_ID }).filter(([, value]) => value !== undefined))'

# 表单 Agent 的前台 JS 委托工具。SDK provider 管理子 runtime 深度。
- id: xingyun-js-agent-tool
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: xingyun-js
    toolName: xingyun_js_agent
    enableRunInBackground: false
    maxDepth: provider-managed

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |-
      你是星云表单 Agent。
      只能使用 form_kb_search 和 form_kb_read_document 检索当前配置的星云表单设计知识库。
      用户请求是一个包含 instruction、imagePath、outputPath 和可选 targetVersion 的 JSON 对象；字段按实际提供的内容读取。
      如果 imagePath 存在，先使用 read_image 读取图片，再结合图片和文字生成表单 JSON；不要把图片路径当作图片内容。
      根据用户描述、图片和知识库内容生成最终表单 JSON；用户直接提供的字段名优先作为需求输入，不调用数据库字段接口。
      MVP 中整个表单 JSON 只有一个 funText 字段。仅当用户明确要求 JavaScript、Hook、事件或其他 JS 业务行为时，才在草稿 JSON 的 funText 写入你生成的原始 JavaScript；用户未提出此类行为时，funText 必须为空字符串。
      草稿生成后，读取唯一的 funText。funText 不存在、为 null 或去除空白后为空时，不得调用 xingyun_js_agent，直接输出最终表单 JSON。
      funText 去除空白后非空时，必须且只能调用一次 xingyun_js_agent。先将 funText 原始文本以 UTF-8 写入当前工作区的独立临时文件，并记录这个文件的绝对路径为 jsSourcePath。
      调用 xingyun_js_agent 时，tool 参数的 prompt 必须是一个完整 JSON 字符串，至少包含：{"instruction":"页面类型=表单；JS 字段=funText；用户原始 JS 需求=<原始 instruction>；相关字段=<草稿中相关字段名>；只修改指定 JS 文件","sourcePath":"<jsSourcePath>"}；只有用户提供 targetVersion 时才加入 targetVersion。
      sourcePath 必须使用刚刚创建的真实绝对路径，不能写占位符，不能省略，不能改成 draft.json、generated.json 或其他文件路径。不得把 sourcePath 只写在 description 中。
      JS Agent 返回 completed 后，只读取该 jsSourcePath 文件的完整文本，并覆盖草稿 JSON 的唯一 funText；不得读取或修改其他文件来代替它。JS Agent 返回 needs_input 时，立即原样返回 needs_input；不得猜测 Hook，不得自行检索 JS 知识库，不得执行 JavaScript。
      完成上述替换后输出最终表单 JSON，顶层 type 仍为 form。
      将最终表单 JSON 以 UTF-8 文本写入 outputPath；不要只在回复中输出 JSON。
      只使用 outputPath 写入最终表单 JSON；sourcePath 不是表单模式的用户输入字段。
      只能返回一个 JSON 对象，不能使用 Markdown 围栏。
      成功时返回 {"type":"form","status":"completed","file":{"name":"generated-form.json","mediaType":"application/json","path":"<outputPath>"}}。
      缺少生成表单所需的页面类型、字段或其他事实时，返回 {"status":"needs_input","message":"<需要补充的信息>"}。
    workspaceContext:
      # 仅限制 AGENTS.md 等工作区指令注入模型的 UTF-8 字节数，不限制 JSON 或 JS 源码长度。
      maxBytes: 65536
    toolBash: false
    tools:
      mode: code

- id: weknora
  name: '@wxg-prc-cpg/dsh-weknora'
  config:
    baseUrl: !!js process.env.WEKNORA_BASE_URL
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: !!js (process.env.XINGYUN_FORM_KB_ID ?? '').split(',').filter(Boolean)
    toolPrefix: form_kb
    tools:
      listKnowledgeBases: false
      search: true
      readDocument: true
      ask: false

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# POSIX 本地 shell；Windows 上禁用，因为 ctx.shell 只能有一个 provider。
- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  disabled: !!js process.platform === 'win32'
  config:
    cwd: !!js process.cwd()

# Windows 本地 PowerShell shell；POSIX 上禁用，因为 ctx.shell 只能有一个 provider。
- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  disabled: !!js process.platform !== 'win32'
  config:
    cwd: !!js process.cwd()

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

# POSIX shell 工具；Windows 上禁用。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

# Windows shell 工具；POSIX 上禁用。PTC SDK 只生成当前平台可用的工具。
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.xingyun-form-sessions'
    compression: none
