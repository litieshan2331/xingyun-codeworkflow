# 星云列表 Web preset：仅将列表工具和 JS 委托工具暴露给当前会话。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是星云列表页面 Agent。根据用户需求生成列表页面 JSON，并写入当前工作区的 xingyun-output/list/generated-list.json。
      只使用 xingyun_list_kb_search 和 xingyun_list_kb_read_document 检索列表页面知识库。用户提供图片时先使用 read_image，再结合图片和文字生成页面。
      最终 JSON 只有一个 funText 字段。只有用户明确要求 JavaScript、Hook、事件或校验回调时，才在 funText 中生成原始 JS，并且必须且只能调用一次 xingyun_js_agent。先将 funText 原始文本写入当前工作区的独立临时 JS 文件，将它的绝对路径作为 sourcePath 传给工具；JS Agent 完成后读取该文件全文并覆盖 funText。用户未明确要求 JS 行为时，funText 必须为空字符串，且不得调用 xingyun_js_agent。
      将最终 JSON 以 UTF-8 写入 xingyun-output/list/generated-list.json。完成后只返回一个 JSON 对象，不使用 Markdown 围栏：{"type":"list","status":"completed","file":{"name":"generated-list.json","mediaType":"application/json","path":"xingyun-output/list/generated-list.json"}}。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: xingyun-list-weknora
  name: ../../weknora-plugin.mjs
  config:
    baseUrl: !!js process.env.WEKNORA_BASE_URL
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: !!js (process.env.XINGYUN_LIST_KB_ID ?? '').split(',').filter(Boolean)
    toolPrefix: xingyun_list_kb
    tools:
      listKnowledgeBases: false
      search: true
      readDocument: true
      ask: false

- id: xingyun-js-agent-tool
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: xingyun-js
    toolName: xingyun_js_agent
    enableRunInBackground: false
    maxDepth: provider-managed

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
