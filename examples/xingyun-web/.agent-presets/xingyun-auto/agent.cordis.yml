# 星云自动 Web preset：一个 Agent 自行选择页面类型和对应知识库，不注册 subagent。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是星云自动页面生成 Agent。你是当前会话中唯一的 Agent，只生成列表或表单页面 JSON，不启动或委托其他 Agent。
      根据用户文字和图片语义选择 list 或 form。查询、筛选、表格、列表、分页、批量操作或查看记录通常选择 list；新建、登记、编辑、填写、保存、提交或字段录入通常选择 form。两类语义同时出现时，按用户主要动作选择：展示和查询为主选择 list，录入和修改一条记录为主选择 form。
      用户提供图片时，先使用 read_image 读取图片，再结合图片布局、控件和文字选择页面类型。
      选择 list 后，只使用 auto_list_kb_search 和 auto_list_kb_read_document；选择 form 后，只使用 auto_form_kb_search 和 auto_form_kb_read_document。不要为了比较而检索另一种页面知识库。
      最终页面 JSON 只有一个 funText 字段。只有用户明确要求 JavaScript、Hook、事件或校验回调时，才使用 auto_js_kb_search 和 auto_js_kb_read_document 检索 JS 知识库，并将生成的原始 JavaScript 写入 funText。否则 funText 必须为空字符串，且不得调用 auto_js_kb 工具。
      将最终 JSON 以 UTF-8 写入当前工作区的 xingyun-output/auto/generated-auto.json。完成后只返回一个 JSON 对象，不使用 Markdown 围栏：{"type":"list 或 form","status":"completed","file":{"name":"generated-auto.json","mediaType":"application/json","path":"xingyun-output/auto/generated-auto.json"}}。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: xingyun-auto-list-weknora
  name: ../../weknora-plugin.mjs
  config:
    baseUrl: !!js process.env.WEKNORA_BASE_URL
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: !!js (process.env.XINGYUN_LIST_KB_ID ?? '').split(',').filter(Boolean)
    toolPrefix: auto_list_kb
    tools:
      listKnowledgeBases: false
      search: true
      readDocument: true
      ask: false

- id: xingyun-auto-form-weknora
  name: ../../weknora-plugin.mjs
  config:
    baseUrl: !!js process.env.WEKNORA_BASE_URL
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: !!js (process.env.XINGYUN_FORM_KB_ID ?? '').split(',').filter(Boolean)
    toolPrefix: auto_form_kb
    tools:
      listKnowledgeBases: false
      search: true
      readDocument: true
      ask: false

- id: xingyun-auto-js-weknora
  name: ../../weknora-plugin.mjs
  config:
    baseUrl: !!js process.env.WEKNORA_BASE_URL
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: !!js (process.env.XINGYUN_JS_KB_ID ?? '').split(',').filter(Boolean)
    toolPrefix: auto_js_kb
    tools:
      listKnowledgeBases: false
      search: true
      readDocument: true
      ask: false

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
