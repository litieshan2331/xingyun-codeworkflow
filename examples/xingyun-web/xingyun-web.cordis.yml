# 星云 Web 测试 overlay。
# 四个 preset 由 DSH_HOME/.agent-presets 自动发现；该 overlay 只提供共享模型路由和 JS 子 runtime provider。

- id: llm-pi-ai
  config:
    providers:
      vllm:
        apiKeyEnv: VLLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.VLLM_BASE_URL
        models:
          - id: Qwen/Qwen3.6-27B-FP8
            input: [text, image]

- id: agent-default-model
  config:
    provider: vllm
    model: Qwen/Qwen3.6-27B-FP8

- id: agent-presets
  config:
    default: xingyun-auto

- id: compaction-basic
  disabled: false

- id: tool-result-pruner
  disabled: false

- id: command-compact
  disabled: false

- insert:
    # 该 provider 位于 Web Host 平面。list/form preset 仅注册自己的 xingyun_js_agent 工具。
    - id: xingyun-js-runtime
      name: '@deepseek-ai/dsh-subagent-dsh-sdk'
      config:
        providerName: xingyun-js
        command: !!js process.execPath
        args: !!js '[process.env.XINGYUN_JSONRPC_BIN, process.env.XINGYUN_JS_AGENT_CONFIG]'
        provider: vllm
        model: Qwen/Qwen3.6-27B-FP8
        env: !!js 'Object.fromEntries(Object.entries({ VLLM_API_KEY: process.env.VLLM_API_KEY, VLLM_BASE_URL: process.env.VLLM_BASE_URL, WEKNORA_BASE_URL: process.env.WEKNORA_BASE_URL, WEKNORA_API_KEY: process.env.WEKNORA_API_KEY, WEKNORA_TENANT_ID: process.env.WEKNORA_TENANT_ID, XINGYUN_JS_KB_ID: process.env.XINGYUN_JS_KB_ID }).filter(([, value]) => value !== undefined))'
